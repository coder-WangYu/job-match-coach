[project]
name = "job-match-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wangyu", email = "coder_wangyu@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48,<49",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "openai>=3.28.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "supabase>=2.32.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
job-match-coach = "job_match_coach:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.vercel]
entrypoint = "src.job_match_coach.main:app"